<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAST Live Viewer</title>
<link rel="stylesheet" href="/assets/studio.css">
<style>
  body { height: 100vh; display: flex; flex-direction: column; }
  #stage { flex: 1; position: relative; min-height: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  .bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 8px 16px;
    border-bottom: 1px solid var(--line); }
  #info { position: absolute; left: 12px; bottom: 12px; font-size: 13px; background: color-mix(in srgb, var(--bg) 85%, transparent);
    padding: 8px 10px; border-radius: 8px; max-width: min(90vw, 36rem); }
</style>
<script type="module" src="/assets/view.js"></script>
</head>
<body>
<header>
  <a href="/" class="brand">CAST Live Studio</a>
  <span id="title"></span>
</header>
<div class="bar">
  <label>Light <select id="light">
    <option value="soft">Soft</option>
    <option value="raking">Raking (read inscriptions)</option>
    <option value="flat">Colour only</option>
  </select></label>
  <label>Light angle <input id="angle" type="range" min="0" max="360" value="45"></label>
  <a id="download" class="plain" download>Download GLB</a>
</div>
<div id="stage"><div id="info">Loading…</div></div>
</body>
</html>
